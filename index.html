<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockholm Weather</title>
  <link rel="stylesheet" href="styleSheet.css">
</head>
<body>

  <a href="index2.html">5-Day Forecast</a>

  <div class="box">
    <div class="weather">
      <h1 class="cityName">Stockholm</h1>
      <h2 class="iconimage"></h2>
      <h3 class="temp">--°C</h3>
      <h4 class="time">--:--:--</h4>
    </div>

    <table>
      <tr>
        <th>🌬 Wind Speed</th>
        <td class="windkm">--</td>
      </tr>
      <tr>
        <th>📍 Latitude</th>
        <td class="latitude">--</td>
      </tr>
      <tr>
        <th>📍 Longitude</th>
        <td class="longitude">--</td>
      </tr>
    </table>
  </div>

  <script src="WeatherApp.js"></script>
</body>
</html>
