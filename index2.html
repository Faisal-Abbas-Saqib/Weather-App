<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockholm — 5-Day Forecast</title>
  <link rel="stylesheet" href="styleSheet.css">
</head>
<body>

  <a href="index.html">Today's Weather</a>

  <div class="forecast-wrapper">
    <p class="forecast-heading">5-Day Forecast · Stockholm</p>

    <table>
      <tr>
        <th>📅 Day</th>
        <td id="nrOfdays">--</td>
      </tr>
      <tr>
        <th>🗓 Date</th>
        <td id="date">--</td>
      </tr>
      <tr>
        <th>🌡 Min Temp</th>
        <td class="min_temp">--</td>
      </tr>
      <tr>
        <th>🌤 Weather</th>
        <td class="icon">--</td>
      </tr>
      <tr>
        <th>🌡 Max Temp</th>
        <td class="max_temp">--</td>
      </tr>
    </table>
  </div>

  <script src="WeatherApp.js"></script>
</body>
</html>
