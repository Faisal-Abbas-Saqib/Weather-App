<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockholm — 5-Day Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-grad:      linear-gradient(160deg,#1a0800 0%,#5c1a00 35%,#b84400 65%,#e8720a 100%);
      --accent:       #e8720a;
      --accent-gold:  #f5c842;
      --accent-warm:  #ff9a60;
      --card-bg:      rgba(40,12,0,0.58);
      --card-border:  rgba(232,114,10,0.32);
      --td-bg:        rgba(232,114,10,0.14);
      --td-hover:     rgba(232,114,10,0.28);
      --text-primary: #fff8e0;
      --text-dim:     rgba(255,230,180,0.62);
      --text-gold:    #f5c842;
      --font-serif:   'Playfair Display', Georgia, serif;
      --font-mono:    'IBM Plex Mono', 'Courier New', monospace;
      --r-card:       26px;
      --r-cell:       10px;
      --shadow:       0 28px 72px rgba(0,0,0,0.65), 0 0 0 1px rgba(232,114,10,0.18);
    }

    body {
      min-height: 100vh;
      background: var(--bg-grad);
      background-attachment: fixed;
      background-color: #1a0800;
      font-family: var(--font-serif);
      color: var(--text-primary);
      padding: 36px 16px 64px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(232,114,10,0.18) 0%, transparent 60%),
        linear-gradient(180deg, rgba(20,4,0,0.30) 0%, rgba(20,4,0,0.10) 40%, rgba(20,4,0,0.50) 85%, rgba(10,2,0,0.78) 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      left: 0; right: 0; top: 62%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,114,10,0.35), rgba(245,200,66,0.5), rgba(232,114,10,0.35), transparent);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: clamp(10px, 1.8vw, 12px);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-gold);
      text-decoration: none;
      padding: 9px 22px;
      border: 1px solid rgba(245,200,66,0.28);
      border-radius: 50px;
      background: rgba(40,12,0,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.22s ease;
      margin-bottom: 36px;
      align-self: center;
    }
    a::before { content: '←'; }
    a:hover {
      background: rgba(232,114,10,0.22);
      border-color: var(--accent-gold);
      color: #fff;
      box-shadow: 0 0 20px rgba(245,200,66,0.18);
      transform: translateY(-2px);
    }

    /* ── FORECAST CARD ─────────────────────────────── */
    .forecast-wrapper {
      position: relative;
      z-index: 1;
      width: min(780px, 96vw);
      background: var(--card-bg);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      border: 1px solid var(--card-border);
      border-radius: var(--r-card);
      box-shadow: var(--shadow);
      padding: clamp(28px, 5vw, 44px);
      margin: 0 auto;
      align-self: center;
      overflow: hidden;
    }

    .forecast-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(245,200,66,0.4) 20%, #f5c842 50%,
        rgba(245,200,66,0.4) 80%, transparent 100%);
      border-radius: var(--r-card) var(--r-card) 0 0;
    }

    .forecast-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--r-card);
      background: radial-gradient(ellipse at 50% -10%, rgba(232,114,10,0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── HEADING ───────────────────────────────────── */
    .forecast-heading {
      font-family: var(--font-serif);
      font-size: clamp(18px, 3.5vw, 26px);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .forecast-ornament {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--accent-gold);
      opacity: 0.75;
      margin-bottom: 28px;
    }

    /* ── TABLE ─────────────────────────────────────── */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      margin-top: 4px;
      table-layout: fixed;
      background-image: none;
    }

    tr { height: auto; }

    th {
      font-family: var(--font-mono);
      font-size: clamp(9px, 1.6vw, 11px);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: left;
      padding: 14px 18px;
      white-space: nowrap;
      width: 22%;
      vertical-align: middle;
    }

    td {
      background: var(--td-bg);
      border: 1px solid rgba(232,114,10,0.20);
      border-radius: var(--r-cell);
      text-align: center;
      padding: 14px 12px;
      font-family: var(--font-mono);
      font-size: clamp(11px, 1.8vw, 13px);
      font-weight: 400;
      color: var(--text-gold);
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s, box-shadow 0.2s;
      word-break: break-word;
      overflow-wrap: break-word;
      background-image: none;
    }

    td:hover {
      background: var(--td-hover);
      box-shadow: 0 0 0 1px rgba(245,200,66,0.30);
    }

    #nrOfdays {
      color: var(--accent-warm);
      background: rgba(255,154,96,0.12);
      word-spacing: 10px;
    }
    #date {
      word-spacing: 8px;
      font-size: clamp(9px,1.5vw,11px);
      color: var(--text-dim);
    }
    tr .min_temp { word-spacing: 14px; color: #7ec8f5; }
    tr .max_temp { word-spacing: 14px; color: var(--accent-gold); }
    tr .icon     { word-spacing: 18px; font-size: clamp(18px,4vw,24px); letter-spacing: 0; padding: 10px 12px; }

    /* ── ANIMATIONS ────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    a                  { animation: fadeUp 0.5s ease both 0.05s; }
    .forecast-wrapper  { animation: fadeUp 0.65s ease both 0.15s; }
    tr:nth-child(1)    { animation: fadeUp 0.5s ease both 0.22s; }
    tr:nth-child(2)    { animation: fadeUp 0.5s ease both 0.30s; }
    tr:nth-child(3)    { animation: fadeUp 0.5s ease both 0.38s; }
    tr:nth-child(4)    { animation: fadeUp 0.5s ease both 0.46s; }
    tr:nth-child(5)    { animation: fadeUp 0.5s ease both 0.54s; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(232,114,10,0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── RESPONSIVE ────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 18px 10px 48px; }
      a { font-size: 10px; padding: 8px 16px; margin-bottom: 20px; }
      .forecast-wrapper { padding: 20px 14px; border-radius: 20px; }
      th { width: 28%; padding: 10px 8px; font-size: 9px; }
      td { padding: 10px 6px; font-size: 10px; }
      #nrOfdays, tr .min_temp, tr .max_temp, #date { word-spacing: 4px; }
      tr .icon { word-spacing: 8px; font-size: 16px; }
    }
    @media (min-width: 481px) and (max-width: 767px) {
      .forecast-wrapper { width: min(96vw, 640px); }
      #nrOfdays { word-spacing: 6px; }
      tr .min_temp, tr .max_temp { word-spacing: 8px; }
      #date { word-spacing: 5px; }
      tr .icon { word-spacing: 12px; }
    }
    @media (min-width: 1024px) {
      body { padding: 44px 40px 80px; }
      .forecast-wrapper { width: min(780px, 88vw); }
    }
    @media (min-width: 1440px) {
      .forecast-wrapper { width: min(860px, 72vw); padding: 48px; }
      th { font-size: 12px; padding: 16px 20px; }
      td { font-size: 14px; padding: 16px 14px; }
    }
  </style>
</head>
<body>

  <a href="index.html">Today's Weather</a>

  <div class="forecast-wrapper">
    <p class="forecast-heading">5-Day Forecast</p>
    <p class="forecast-ornament">— ✦ — Stockholm — ✦ —</p>

    <table>
      <tr>
        <th>📅 Day</th>
        <td id="nrOfdays">--</td>
      </tr>
      <tr>
        <th>🗓 Date</th>
        <td id="date">--</td>
      </tr>
      <tr>
        <th>🌡 Min</th>
        <td class="min_temp">--</td>
      </tr>
      <tr>
        <th>🌤 Sky</th>
        <td class="icon">--</td>
      </tr>
      <tr>
        <th>🌡 Max</th>
        <td class="max_temp">--</td>
      </tr>
    </table>
  </div>

  <script>
    const weather5 = {
      0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌧️",53:"🌧️",
      55:"🌧️",56:"🌧️",57:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",66:"🌧️",
      67:"🌧️",71:"❄️",73:"❄️",75:"❄️",95:"⛈️"
    };

    function checkWeather5() {
      fetch("https://api.open-meteo.com/v1/forecast?latitude=59.3293&longitude=18.0686&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Stockholm&forecast_days=5")
        .then(r => r.json())
        .then(data => {
          let icons = "";
          for (let j = 0; j < 5; j++) icons += weather5[data.daily.weathercode[j]] + "  ";
          document.querySelector(".icon").innerHTML = icons;
          let mn = "", mx = "";
          for (let i = 0; i < 5; i++) {
            mn += Math.round(data.daily.temperature_2m_min[i]) + "°  ";
            mx += Math.round(data.daily.temperature_2m_max[i]) + "°  ";
          }
          document.querySelector(".min_temp").innerHTML = mn;
          document.querySelector(".max_temp").innerHTML = mx;
        });
    }
    checkWeather5();

    const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const today = new Date();
    const day1 = today.getDay();
    const dateT = today.getDate(), month = today.getMonth(), year = today.getFullYear();
    let day = "", date5 = "", j = 0;
    for (let i = day1; i < days.length; i++) {
      if (j == 5) break;
      day += days[i] + "  "; date5 += (month+1) + "/" + (dateT+j) + "  "; j++;
    }
    for (let i = 0; i < day1; i++) {
      if (j == 5) break;
      day += days[i] + "  "; date5 += (month+1) + "/" + (dateT+j) + "  "; j++;
    }
    document.getElementById("nrOfdays").innerHTML = day;
    document.getElementById("date").innerHTML = date5;
  </script>
</body>
</html>
